[project]
name = "shubh-tithi"
version = "0.1.0"
description = "ShubhTithi — open-source FastAPI service computing Hindu Panchang (almanac) data with Swiss Ephemeris."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyswisseph>=2.10.3",
    "sqlalchemy>=2.0.30",
    "timezonefinder>=6.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
